<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="truckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="#f59e0b" stroke-width="8" stroke-opacity="0.3" />

  <!-- Truck Icon -->
  <g transform="translate(64, 80) scale(0.75)" fill="none" stroke="url(#truckGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Truck Trailer Cargo Box -->
    <rect x="40" y="80" width="280" height="200" rx="16" fill="#f59e0b" fill-opacity="0.15" />
    <path d="M40 80h280v200H40z" />
    <!-- Horizontal trailer slats -->
    <line x1="40" y1="140" x2="320" y2="140" stroke-width="14" stroke-opacity="0.6" />
    <line x1="40" y1="200" x2="320" y2="200" stroke-width="14" stroke-opacity="0.6" />

    <!-- Truck Cab -->
    <path d="M320 150h70l50 60v70h-120v-130z" fill="#f59e0b" fill-opacity="0.25" />
    <!-- Cab Window -->
    <path d="M340 170h45l35 40h-80v-40z" fill="#0f172a" stroke="none" />
    
    <!-- Wheels -->
    <circle cx="120" cy="300" r="42" fill="#0f172a" stroke-width="24" />
    <circle cx="120" cy="300" r="14" fill="#fbbf24" stroke="none" />
    
    <circle cx="240" cy="300" r="42" fill="#0f172a" stroke-width="24" />
    <circle cx="240" cy="300" r="14" fill="#fbbf24" stroke="none" />

    <circle cx="390" cy="300" r="42" fill="#0f172a" stroke-width="24" />
    <circle cx="390" cy="300" r="14" fill="#fbbf24" stroke="none" />
  </g>

  <!-- Text Badge -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4">SRI MALLIKARJUNA</text>
  <text x="256" y="465" font-family="Arial, sans-serif" font-weight="800" font-size="28" fill="#fbbf24" text-anchor="middle" letter-spacing="6">TRANSPORT</text>
</svg>
